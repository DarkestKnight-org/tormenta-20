
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar atividade do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Configure os Secrets do Supabase no GitHub."
            exit 1
          fi

          URL="${SUPABASE_URL%/}"

          STATUS=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 30 \
            "$URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY")

          echo "HTTP recebido: $STATUS"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "A consulta não foi concluída com sucesso."
            exit 1
          fi

          echo "Consulta concluída com sucesso."
